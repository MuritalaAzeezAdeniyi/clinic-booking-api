version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: clinic-booking-postgres
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic_booking_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_booking_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
